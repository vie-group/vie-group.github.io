name: Seminar material submission
description: Submit group seminar metadata and links for review.
title: "[Seminar] YYYY-MM-DD Speaker - Title"
labels: ["seminar-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this form if you do not have direct write access. A workflow will turn the issue into a pull request.
        If you need to attach local PPT/PDF files, upload them to the issue comment first and paste the generated links below.
  - type: input
    id: date
    attributes:
      label: Date
      description: Use YYYY-MM-DD.
      placeholder: "2024-04-07"
    validations:
      required: true
  - type: input
    id: speaker
    attributes:
      label: Speaker
      placeholder: "Name"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "Paper or talk title"
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      placeholder: "https://arxiv.org/pdf/..."
    validations:
      required: false
  - type: input
    id: slides_url
    attributes:
      label: Slides URL
      placeholder: "https://github.com/.../slides.pptx"
    validations:
      required: false
  - type: input
    id: code_url
    attributes:
      label: Code URL
      placeholder: "https://github.com/..."
    validations:
      required: false
  - type: input
    id: video_url
    attributes:
      label: Video URL
      placeholder: "Optional"
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated.
      placeholder: "IQA, diffusion"
    validations:
      required: false
  - type: textarea
    id: abstract
    attributes:
      label: Abstract
      placeholder: "Optional short summary."
    validations:
      required: false
