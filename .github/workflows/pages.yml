name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "wayback-20240414-1to1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vie-group/vie-group-content
          ref: main
          path: .content-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sync:content
      - run: node scripts/update-legacy-presentation.mjs --sync-managed
      - run: npm run build:rss
      - run: npm run validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
