name: Seminar Issue to Pull Request

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: contains(github.event.issue.labels.*.name, 'seminar-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Store issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node -e 'require("node:fs").writeFileSync("/tmp/seminar-issue.md", process.env.ISSUE_BODY || "")'
      - id: seminar
        name: Convert issue form to data
        env:
          ISSUE_BODY_PATH: /tmp/seminar-issue.md
        run: node scripts/issue-form-to-data.mjs seminar
      - run: npm run build:rss
      - run: npm run validate
      - name: Create or update PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SEMINAR_TITLE: ${{ steps.seminar.outputs.title }}
          SEMINAR_ID: ${{ steps.seminar.outputs.id }}
        run: |
          set -euo pipefail
          branch="seminar-submission-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/seminars.json rss.xml

          if git diff --cached --quiet; then
            gh issue comment "$ISSUE_NUMBER" --body "No data change was detected for \`${SEMINAR_ID}\`."
            exit 0
          fi

          git commit -m "Add seminar: ${SEMINAR_TITLE}"
          git push --force-with-lease origin "$branch"

          pr_url="$(gh pr list --base main --head "$branch" --json url --jq '.[0].url')"
          body="Automated seminar submission from ${ISSUE_URL}.

          Closes #${ISSUE_NUMBER}"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head "$branch" --title "Add seminar: ${SEMINAR_TITLE}" --body "$body")"
          else
            gh pr edit "$pr_url" --title "Add seminar: ${SEMINAR_TITLE}" --body "$body"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "Created/updated PR: ${pr_url}"
