name: Sync Content Repository

on:
  workflow_dispatch:
    inputs:
      content_ref:
        description: "Branch, tag, or commit in vie-group-content"
        required: true
        default: "main"
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        with:
          repository: vie-group/vie-group-content
          ref: ${{ github.event.inputs.content_ref || github.event.client_payload.content_ref || 'main' }}
          path: .content-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sync:content
      - run: node scripts/update-legacy-presentation.mjs --sync-managed
      - run: npm run build:rss
      - run: npm run validate
      - name: Commit synced content
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-source.json data presentation/index.html rss.xml
          git commit -m "Sync website content from vie-group-content" || exit 0
          git push
